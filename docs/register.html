<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 – 書籍貸出管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">📚 書籍貸出管理</a>
    </div>
  </nav>

  <div class="container" style="max-width: 420px;">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">新規登録</h1>

        <div class="mb-3">
          <label class="form-label" for="name">お名前</label>
          <input type="text" class="form-control" id="name" placeholder="山田 太郎">
        </div>

        <div class="mb-3">
          <label class="form-label" for="employee_id">社員番号 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="employee_id" placeholder="0000" maxlength="4" pattern="\d{4}">
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">パスワード</label>
          <input type="password" class="form-control" id="password" placeholder="8文字以上">
        </div>

        <div class="mb-4">
          <label class="form-label" for="password_confirm">パスワード（確認）</label>
          <input type="password" class="form-control" id="password_confirm" placeholder="もう一度入力">
        </div>

        <div class="d-grid">
          <a href="login.html" class="btn btn-primary">登録する</a>
        </div>

        <hr class="my-4">

        <p class="text-center text-muted mb-0" style="font-size: 0.9rem;">
          すでにアカウントをお持ちの方は
          <a href="login.html">ログイン</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
