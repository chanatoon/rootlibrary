<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>貸出確認 – 書籍貸出管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .container { max-width: 960px; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">📚 書籍貸出管理</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item">
            <a class="nav-link" href="book_list.html">書籍一覧</a>
          </li>
          <li class="nav-item ms-3">
            <a href="login.html" class="btn btn-outline-light btn-sm">ログアウト</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4" style="max-width: 560px;">

    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="book_list.html">書籍一覧</a></li>
        <li class="breadcrumb-item active">貸出手続き</li>
      </ol>
    </nav>

    <h1 class="h3 mb-4">貸出手続き</h1>

    <!-- 対象書籍 -->
    <div class="card bg-light border-0 mb-4">
      <div class="card-body py-3">
        <p class="text-muted mb-1" style="font-size: 0.8rem;">対象書籍</p>
        <p class="fw-semibold mb-0">鬼滅の刃 (1) <span class="text-muted fw-normal">／ 吾峠 呼世晴</span></p>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">

        <div class="mb-3">
          <label class="form-label" for="borrower">借りる人の名前 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="borrower" placeholder="山田 太郎">
        </div>

        <div class="mb-4">
          <label class="form-label" for="due_date">返却予定日 <span class="text-danger">*</span></label>
          <input type="date" class="form-control" id="due_date">
        </div>

        <div class="d-flex gap-2">
          <a href="book_list.html" class="btn btn-primary">貸出を確定する</a>
          <a href="book_list.html" class="btn btn-outline-secondary">キャンセル</a>
        </div>

      </div>
    </div>

  </div>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">&copy; 2025 書籍貸出管理システム</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
