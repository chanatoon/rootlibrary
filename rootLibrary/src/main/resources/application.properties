spring.application.name=rootLibrary


app.auth.employee-id=root
app.auth.password=pass

# ==========================================
# データベース接続設定
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3307/rootLibrary?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
# ※MySQL設定時に決めたパスワードを入力してください
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate 設定
# ==========================================
# SQLの方言指定
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# DDLの自動生成（開発中はupdate、本番はvalidateを推奨）
spring.jpa.hibernate.ddl-auto=update
# コンソールに発行SQLを表示
spring.jpa.show-sql=true
