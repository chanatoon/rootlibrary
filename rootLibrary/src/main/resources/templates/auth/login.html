<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン – 書籍貸出管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">📚 書籍貸出管理</a>
  </div>
</nav>

<div class="container" style="max-width: 420px;">
  <div class="card shadow-sm mt-5">
    <div class="card-body p-4">
      <h1 class="h4 mb-4 text-center">ログイン</h1>

      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label" for="employeeId">社員番号</label>
          <input type="text" class="form-control" id="employeeId" name="employeeId"
                 placeholder="0000" maxlength="4" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">パスワード</label>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="パスワードを入力" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">ログイン</button>
        </div>
      </form>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
