<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${book.id != null} ? '書籍を編集' : '書籍を追加'">書籍フォーム – 書籍貸出管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.container { max-width: 960px; }</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/books">📚 書籍貸出管理</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="/books">書籍一覧</a></li>
        <li class="nav-item ms-3">
          <a href="/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4" style="max-width: 600px;">

  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/books">書籍一覧</a></li>
      <li class="breadcrumb-item active"
          th:text="${book.id != null} ? '書籍を編集' : '書籍を追加'"></li>
    </ol>
  </nav>

  <h1 class="h3 mb-4" th:text="${book.id != null} ? '書籍を編集' : '書籍を追加'"></h1>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="post" action="/books/save">
        <input type="hidden" name="id" th:value="${book.id}">
        <input type="hidden" name="status" th:value="${book.status ?: 'AVAILABLE'}">
        <input type="hidden" name="borrower" th:value="${book.borrower}">
        <input type="hidden" name="dueDate" th:value="${book.dueDate}">

        <div class="mb-3">
          <label class="form-label" for="title">書籍名 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="title" name="title"
                 th:value="${book.title}" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="author">著者 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="author" name="author"
                 th:value="${book.author}" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="publishedYear">出版年</label>
          <input type="number" class="form-control" id="publishedYear" name="publishedYear"
                 th:value="${book.publishedYear}" min="1900" max="2099">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">保存する</button>
          <a href="/books" class="btn btn-outline-secondary">キャンセル</a>
        </div>
      </form>
    </div>
  </div>

  <!-- 削除ボタン（編集時のみ表示） -->
  <div th:if="${book.id != null}" class="mt-4 pt-3 border-top">
    <p class="text-muted mb-2" style="font-size: 0.875rem;">
      削除すると元に戻せません。
    </p>
    <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post"
          onsubmit="return confirm('この書籍を削除しますか？')">
      <button type="submit" class="btn btn-outline-danger btn-sm">この書籍を削除する</button>
    </form>
  </div>

</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
  <div class="container">
    <p class="mb-0">&copy; 2025 書籍貸出管理システム</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
