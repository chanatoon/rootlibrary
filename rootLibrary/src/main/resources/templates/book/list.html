<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書籍一覧 – 書籍貸出管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.container { max-width: 960px; }</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/books">📚 書籍貸出管理</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link active" href="/books">書籍一覧</a></li>
        <li class="nav-item ms-3">
          <a href="/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">書籍一覧</h1>
    <a href="/books/new" class="btn btn-primary">＋ 書籍を追加</a>
  </div>

  <form method="get" action="/books" class="input-group mb-4">
    <input type="text" class="form-control" name="keyword"
           th:value="${keyword}" placeholder="書籍名、著者名で検索...">
    <button class="btn btn-outline-secondary" type="submit">検索</button>
  </form>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>書籍名</th>
          <th>著者</th>
          <th>出版年</th>
          <th>借りている人</th>
          <th>状態</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="book : ${books}">
          <td th:text="${book.id}"></td>
          <td th:text="${book.title}"></td>
          <td th:text="${book.author}"></td>
          <td th:text="${book.publishedYear}"></td>
          <td th:text="${#strings.isEmpty(book.borrower) ? '-' : book.borrower}"></td>
          <td>
            <span th:if="${book.available}" class="badge bg-success">貸出可</span>
            <span th:if="${!book.available and !book.overdue}" class="badge bg-warning text-dark">貸出中</span>
            <span th:if="${book.overdue}" class="badge bg-danger">延滞中</span>
          </td>
          <td>
            <a th:if="${book.available}" th:href="@{/books/{id}/lend(id=${book.id})}"
               class="btn btn-sm btn-outline-primary me-1">貸出</a>
            <a th:if="${!book.available}" th:href="@{/books/{id}/return(id=${book.id})}"
               class="btn btn-sm btn-outline-success me-1">返却</a>
            <a th:href="@{/books/{id}/edit(id=${book.id})}"
               class="btn btn-sm btn-outline-secondary">編集</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(books)}">
          <td colspan="7" class="text-center text-muted py-4">書籍が見つかりませんでした</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
  <div class="container">
    <p class="mb-0">&copy; 2025 書籍貸出管理システム</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
